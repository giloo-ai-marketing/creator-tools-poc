<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giloo Creator Tools POC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#121110; --bg-2:#171615; --surface:#1C1B19; --surface-2:#242220; --surface-3:#2C2A27;
    --line:#2E2C29; --line-2:#3A3733;
    --text:#F2EFE8; --muted:#A39E94; --dim:#6E6A63;
    --accent:#EA2B40; --accent-2:#FF5A6C; --accent-dim:#2E1A1D;
    --ok:#6FCF97; --warn:#F2B23E;
    --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sidebar:256px; --panel:420px; --radius:14px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--accent-2);text-decoration:none}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
  h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  /* ---------- shell ---------- */
  .shell{display:flex;height:100%;min-height:0}
  .sidebar{width:var(--sidebar);flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:2px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);flex-shrink:0}
  .brand-name{font-weight:700;font-size:14px;flex-grow:1;white-space:nowrap}
  .brand-tag{font-size:10px;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:transparent;text-align:left;color:var(--text)}
  .nav-btn:hover{background:var(--surface-2)}
  .nav-btn.primary{background:var(--surface-2);font-weight:500}
  .nav-btn.active{background:var(--surface-3)}
  .nav-btn .ico{width:24px;height:24px;border-radius:12px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
  .nav-btn.primary .ico{background:#3A3733;color:var(--text)}
  .nav-btn .sub{font-size:11px;color:var(--dim);margin-left:auto}
  .nav-sec{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 4px;font-size:11px;letter-spacing:.06em;color:var(--dim)}
  .chat-item{display:flex;flex-direction:column;gap:1px;width:100%;padding:8px 12px;border-radius:8px;border:0;background:transparent;text-align:left;color:var(--text)}
  .chat-item:hover{background:var(--surface-2)}
  .chat-item.active{background:var(--surface-3)}
  .chat-item .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-item .s{font-size:11px;color:var(--dim)}
  .chat-empty{padding:8px 12px;font-size:12px;color:var(--dim);line-height:1.6}
  .credits{margin-top:auto;padding:12px 14px;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
  .credits .l{font-size:11px;color:var(--muted)}
  .credits .v{font-size:20px;font-weight:700}
  .credits .v span{font-size:11px;font-weight:400;color:var(--muted)}
  .account{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
  .avatar{width:24px;height:24px;border-radius:12px;background:var(--surface-3)}

  .main{flex-grow:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:none;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--bg-2)}
  .topbar .brand{padding:0;flex-grow:1}
  .icon-btn{width:36px;height:36px;border-radius:18px;border:1px solid var(--line-2);background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
  .scroll{flex-grow:1;overflow-y:auto;min-height:0}
  .page{max-width:1120px;margin:0 auto;padding:28px 40px 48px;display:flex;flex-direction:column;gap:28px}

  /* ---------- product bar ---------- */
  .eyebrow{display:flex;align-items:baseline;gap:10px;font-size:11px;letter-spacing:.06em;color:var(--dim)}
  .eyebrow .n{color:var(--muted);letter-spacing:0;font-size:12px}
  .products{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .product{display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text);min-width:0;text-align:left;transition:border-color .15s,transform .15s}
  .product:hover{border-color:var(--line-2);transform:translateY(-1px)}
  .product.active{border-color:var(--accent)}
  .product .ico{width:36px;height:36px;border-radius:10px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .product .tx{display:flex;flex-direction:column;gap:1px;min-width:0;flex-grow:1}
  .product .nm{font-weight:700;font-size:14px;white-space:nowrap}
  .product .ds{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .product .arr{color:var(--dim);flex-shrink:0}


  /* ---------- top nav ---------- */
  .topnav{display:flex;align-items:center;gap:2px;height:52px;padding:0 16px;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line);background:var(--bg);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
  .topnav::-webkit-scrollbar{display:none}
  .topnav a{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
  .topnav a:hover{color:var(--text);background:var(--surface)}
  .topnav a.on{color:var(--accent-2)}
  .topnav .sep{width:1px;height:18px;background:var(--line-2);margin:0 6px;flex-shrink:0}
  .topnav .badge{font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 6px;border-radius:4px;background:var(--accent);color:#fff;line-height:1.2}
  .topnav .badge.free{background:var(--surface-3);color:var(--muted)}
  .topnav .right{margin-left:auto;display:flex;align-items:center;gap:6px;padding-left:12px}
  .topnav .right .icon-btn{width:34px;height:34px}

  /* ---------- hero composer ---------- */
  .hero{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:28px 4px}
  .hero h1{font-size:30px;letter-spacing:-.01em;text-align:center}
  .hero p{margin:0;color:var(--muted);text-align:center;max-width:56ch}
  .composer{width:100%;max-width:880px;border-radius:18px;background:var(--surface);border:1px solid var(--line-2);padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px -30px rgba(0,0,0,.8)}
  .composer:focus-within{border-color:#4A4641}
  .composer textarea{width:100%;min-height:52px;border:0;background:transparent;color:var(--text);font-size:16px;font-family:inherit;resize:none;outline:none;line-height:1.5}
  .composer textarea::placeholder{color:var(--dim)}
  .composer-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);font-size:13px}
  .chip .k{color:var(--muted)}
  .chip.ghost{border-style:dashed;background:transparent;color:var(--dim)}
  .chip.tool{border-color:var(--accent);background:var(--accent-dim)}
  .chip.tool .dot{width:6px;height:6px;border-radius:3px;background:var(--accent)}
  .chip select{background:transparent;border:0;color:var(--text);font-family:inherit;font-size:13px;outline:none}
  .chip select option{background:#1C1B19;color:#F2EFE8}
  .spacer{flex-grow:1}
  .link-btn{border:0;background:transparent;color:var(--muted);font-size:13px;padding:0 8px;height:34px;border-radius:17px}
  .link-btn:hover{color:var(--text)}
  .send{width:36px;height:36px;border-radius:18px;border:0;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center}
  .send:hover{background:var(--accent-2)}
  .send:disabled{background:var(--surface-3);color:var(--dim);cursor:not-allowed}
  .tool-pick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .tool-pick button{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px}
  .tool-pick button:hover,.tool-pick button.on{border-color:var(--accent);background:var(--accent-dim)}
  .tool-pick .lbl{font-size:12px;color:var(--dim);align-self:center;margin-right:4px}

  /* ---------- scenarios ---------- */
  .tabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .tabs button{height:32px;padding:0 14px;border-radius:16px;border:0;background:transparent;color:var(--muted);font-size:13px}
  .tabs button.on{background:var(--surface-2);color:var(--text);font-weight:500}
  .tabs .count{margin-left:auto;font-size:12px;color:var(--dim)}
  .scen-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .scen{display:flex;flex-direction:column;gap:10px;padding:18px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);color:var(--text);text-align:left;min-height:140px;transition:border-color .15s,transform .15s}
  .scen:hover{border-color:var(--line-2);transform:translateY(-1px)}
  .scen .stage{font-size:11px;color:var(--dim)}
  .scen .q{font-size:15px;font-weight:700;line-height:1.5;flex-grow:1}
  .scen .uses{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .scen .uses i{width:6px;height:6px;border-radius:3px;background:var(--accent);flex-shrink:0}
  .recent{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);flex-wrap:wrap}
  .recent .l{font-size:12px;color:var(--dim);flex-shrink:0}
  .recent button{height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px}
  .recent button:hover{color:var(--text);border-color:var(--line-2)}

  /* ---------- tool page ---------- */
  .tool-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
  .tool-hero .big{display:flex;flex-direction:column;gap:14px}
  .tool-hero .big .ico{width:48px;height:48px;border-radius:14px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .tool-hero h1{font-size:32px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
  .kv .k{color:var(--dim)}
  .spec{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
  .spec h3{font-size:13px;color:var(--muted);font-weight:500}
  .spec ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
  .spec .price{display:flex;align-items:baseline;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
  .spec .price b{font-size:20px}
  .spec .price span{color:var(--muted);font-size:12px}
  .section-h{display:flex;align-items:baseline;gap:12px}
  .section-h h2{font-size:16px}
  .section-h .d{font-size:12px;color:var(--dim)}

  /* ---------- chat page ---------- */
  .chatwrap{display:flex;height:100%;min-height:0}
  .chatcol{flex-grow:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .chat-top{height:54px;padding:0 24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);font-size:13px;flex-shrink:0;overflow-x:auto}
  .chat-top .chip{height:30px;padding:0 10px}
  .chat-top .st{margin-left:auto;color:var(--dim);white-space:nowrap}
  .chat-top .st.ok{color:var(--ok)}
  .msgs{flex-grow:1;overflow-y:auto;padding:24px 24px 8px;display:flex;flex-direction:column;gap:18px}
  .msg{display:flex;gap:12px;max-width:760px}
  .msg.user{align-self:flex-end;max-width:560px}
  .msg.user .bubble{padding:12px 16px;border-radius:16px 16px 4px 16px;background:var(--surface-3);line-height:1.6}
  .msg .av{width:28px;height:28px;border-radius:8px;background:var(--accent);flex-shrink:0}
  .msg .body{display:flex;flex-direction:column;gap:12px;flex-grow:1;min-width:0;line-height:1.7}
  .msg .body p{margin:0}
  .card{border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .card-sec{padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
  .card-sec:last-child{border-bottom:0}
  .step{display:flex;align-items:center;gap:10px;font-weight:700}
  .step .n{width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
  .file{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
  .file .fi{width:34px;height:34px;border-radius:8px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
  .file .fn{font-weight:500}
  .file .fm{font-size:12px;color:var(--muted)}
  .file .ok{margin-left:auto;font-size:12px;color:var(--ok);white-space:nowrap}
  .opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .opt{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .opt.on{border-color:var(--accent);background:var(--accent-dim);color:var(--text)}
  .opt input{margin:0}
  .opt-big{flex:1 1 140px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);display:flex;flex-direction:column;gap:3px;text-align:left;color:var(--muted)}
  .opt-big b{color:var(--text)}
  .opt-big.on{border-color:var(--accent);background:var(--accent-dim);color:var(--muted)}
  .opt-big.on b{color:var(--text)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:14px}
  .card-foot{padding:14px 18px;background:var(--bg-2);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .card-foot .est b{font-size:16px}
  .card-foot .est span{font-size:12px;color:var(--muted)}
  .card-foot .est small{display:block;font-size:12px;color:var(--muted)}
  .btn{height:40px;padding:0 18px;border-radius:20px;border:1px solid var(--line-2);background:transparent;color:var(--text);font-size:14px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:#4A4641}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.sm{height:32px;padding:0 14px;font-size:13px}
  .confirmed{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap}
  .confirmed .ok{color:var(--ok)}
  .confirmed b{color:var(--text);font-weight:500}
  .progress{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
  .progress .row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
  .progress .row.done{color:var(--muted)}
  .progress .row.done i{background:var(--ok)}
  .progress .row.now{color:var(--text)}
  .progress .row.now i{background:var(--accent);animation:pulse 1s infinite}
  .progress .row i{width:8px;height:8px;border-radius:4px;background:var(--line-2);flex-shrink:0}
  @keyframes pulse{50%{opacity:.3}}
  .qs{display:flex;flex-direction:column;gap:6px}
  .qs div{display:flex;gap:8px}
  .qs span{color:var(--warn);flex-shrink:0;font-weight:700}
  .nexts{display:flex;gap:8px;flex-wrap:wrap}
  .nexts button{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line-2);background:transparent;color:var(--text);font-size:13px}
  .nexts button:hover{border-color:var(--accent);background:var(--accent-dim)}
  .chat-input{padding:14px 24px 20px;flex-shrink:0}
  .chat-input .box{border-radius:14px;background:var(--surface);border:1px solid var(--line-2);padding:10px 12px;display:flex;align-items:center;gap:10px}
  .chat-input input{flex-grow:1;border:0;background:transparent;color:var(--text);font-size:14px;font-family:inherit;outline:none;min-width:0}
  .chat-input .hint{font-size:12px;color:var(--dim);white-space:nowrap}

  .panel{width:var(--panel);flex-shrink:0;background:var(--bg-2);display:flex;flex-direction:column;min-height:0}
  .panel-top{height:54px;padding:0 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-shrink:0}
  .panel-top b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ver{height:22px;padding:0 8px;border-radius:11px;background:var(--surface-2);font-size:11px;color:var(--muted);display:inline-flex;align-items:center;flex-shrink:0}
  .panel-tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto}
  .panel-tabs button{padding:8px 10px;border:0;background:transparent;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
  .panel-tabs button.on{color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
  .panel-body{flex-grow:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
  .panel-empty{flex-grow:1;margin:20px;border-radius:var(--radius);border:1px dashed var(--line-2);padding:24px 20px;display:flex;flex-direction:column;gap:14px;color:var(--muted)}
  .panel-empty .file{background:var(--surface);color:var(--muted);font-size:13px}
  .panel-empty .file i{width:8px;height:8px;border-radius:4px;border:1px solid var(--line-2)}
  .panel-foot{padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
  .blk{display:flex;flex-direction:column;gap:10px}
  .blk .lb{font-size:11px;letter-spacing:.06em;color:var(--dim)}
  .rank{display:flex;gap:12px;padding:14px;border-radius:12px;background:var(--surface)}
  .rank .n{font-size:22px;font-weight:700;color:var(--accent);width:28px;flex-shrink:0}
  .rank.two .n{color:var(--muted)}
  .rank b{display:block;margin-bottom:3px}
  .rank p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
  .rank .flag{color:var(--warn)}
  .row-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);font-size:13px}
  .row-item .poster{width:26px;height:36px;border-radius:3px;background:var(--surface-3);flex-shrink:0}
  .row-item .g{flex-grow:1;min-width:0}
  .row-item .m{font-size:12px;color:var(--muted);white-space:nowrap}
  .note{padding:12px 14px;border-radius:10px;background:var(--surface);font-size:12px;line-height:1.6;color:var(--muted)}
  table.sub{width:100%;border-collapse:collapse;font-size:12px}
  table.sub th{text-align:left;font-weight:500;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line)}
  table.sub td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
  table.sub td.tc{font-family:var(--mono);color:var(--dim);white-space:nowrap}
  table.sub tr.low td{background:rgba(242,178,62,.06)}
  .reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

function detectTool(text){
  const t = text;
  if(/字幕|翻譯|translate|subtitle|英文|日文|韓文/.test(t)) return 'subtitle';
  if(/press ?kit|看片|網站|官網|網頁|劇照|贊助|包裝/i.test(t)) return 'presskit';
  if(/貼文|reels|社群|短片|ig|instagram|threads|發文/i.test(t)) return 'social';
  if(/輿情|討論|誰在談|負評|熱起來|聲量|talk/i.test(t)) return 'listening';
  return 'report';
}

function route(){
  const h = location.hash || '#/';
  const [_, a, b] = h.split('/');
  document.querySelectorAll('[data-nav]').forEach(el => el.classList.toggle('active', el.dataset.nav === a));
  const key = a === 'tool' ? b : a === 'projects' || a === 'project' ? 'projects' : (!a ? 'home' : '');
  document.querySelectorAll('#topnav a').forEach(el => el.classList.toggle('on', el.dataset.key === key));
  if(a === 'tool' && TOOLS[b]) renderTool(b);
  else if(a === 'chat' && sessions.find(s => s.id === b)) renderChat(b);
  else if(a === 'skills') renderSkills();

  else if(a === 'projects') renderProjects();
  else if(a === 'project' && FILMS.find(f => f.id === b)) renderFilm(b);
  else renderHome();
  view.scrollTop = 0;
  renderChatList();
}

function bindComposer(){
  const f = document.getElementById('composer'); if(!f) return;
  const ta = f.querySelector('textarea'), est = f.querySelector('#estChip'), tc = f.querySelector('#toolChip');
  ta.addEventListener('input', () => {
    const tool = f.dataset.tool || detectTool(ta.value);
    if(ta.value.trim()){
      if(tc) tc.innerHTML = `<span class="k">Skill</span> ${TOOLS[tool].name}`;
      est.textContent = TOOLS[tool].est.pts ? `預估 ${TOOLS[tool].est.pts} 點 · ${TOOLS[tool].est.time}` : '先拆步驟，不收費'; est.classList.remove('ghost');
    } else { if(tc) tc.innerHTML = `<span class="k">Skill</span> 自動判斷`; est.textContent = '預估費用 輸入後顯示'; est.classList.add('ghost'); }
  });
  ta.addEventListener('keydown', e => { if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ f.requestSubmit(); } });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const text = ta.value.trim(); if(!text) { ta.focus(); return; }
    startChat({ text, tool: f.dataset.tool || detectTool(text), film: f.querySelector('#filmSel').value });
  });
}

function startChat({text, tool, film}){
  const f = FILMS.find(x => x.id === film) || FILMS[0];
  const s = { id: uid(), tool, film: f.id, title: `${f.name} ${TOOLS[tool].name}`, created: Date.now(), status:'intake', spent:0, msgs:[] };
  s.msgs.push({ role:'user', text });
  s.msgs.push({ role:'assistant', kind:'intake', tool, done:false });
  sessions.unshift(s); saveSessions();
  go('#/chat/'+s.id);
}

function renderChat(id){
  const s = sessions.find(x => x.id === id); const t = TOOLS[s.tool]; const f = FILMS.find(x => x.id === s.film);
  const stTxt = s.status==='done' ? `<span class="st ok">完成 · ${t.est.time.replace('約 ','')}</span>` : s.status==='running' ? `<span class="st">執行中</span>` : `<span class="st">還沒開始，不會扣點</span>`;
  view.innerHTML = `<div class="chatwrap">
    <div class="chatcol">
      <div class="chat-top">
        <span class="chip"><span class="k">片</span> ${f.name}</span>
        <span class="chip tool"><i class="dot"></i>${t.name}</span>
        ${t.est.pts ? `<span class="chip"><span class="k">${s.status==='done'?'已扣':'預估'}</span> <span class="num">${t.est.pts} 點</span>${s.status==='done'?'':' <span class="k">· 完成後才扣</span>'}</span>` : `<span class="chip"><span class="k">費用</span> 不收費</span>`}
        ${stTxt}
      </div>
      <div class="msgs" id="msgs">${s.msgs.map(m => renderMsg(m, s)).join('')}</div>
      <form class="chat-input" id="chatForm"><div class="box">
        <label class="sr-only" for="reply">回覆</label>
        <input id="reply" placeholder="${s.status==='done'?'回答問號，或叫我改任何一段':'有要補充的嗎？例如：人名用羅馬拼音，不要翻'}">
        <span class="hint">修改不扣點</span>
        <button type="submit" class="send" aria-label="送出">${ICONS.send}</button>
      </div></form>
    </div>
    <aside class="panel" id="panel">${renderPanel(s)}</aside>
  </div>`;
  const msgs = document.getElementById('msgs'); msgs.scrollTop = msgs.scrollHeight;
  bindChat(s);
}

function renderMsg(m, s){
  if(m.role === 'user') return `<div class="msg user"><div class="bubble">${esc(m.text)}</div></div>`;
  let body = '';
  if(m.kind === 'intake') body = m.done ? confirmedCard(m.tool, s) : intakeCard(m.tool, s);
  else if(m.kind === 'progress') body = progressCard(m);
  else if(m.kind === 'result') body = resultMsg(m.tool, s);
  else if(m.kind === 'text') body = `<p>${esc(m.text)}</p>`;
  return `<div class="msg"><div class="av"></div><div class="body">${body}</div></div>`;
}

function intakeCard(tool, s){
  const t = TOOLS[tool]; const f = FILMS.find(x => x.id === s.film);
  const intro = {
    subtitle:`好，用<b>字幕翻譯</b>來做。我從《${f.name}》的片子資料抓到中文字幕檔了，你確認三件事，我就開始。投影展的話我會用保守、忠實的譯法，不加梗。`,
    report:`好，用<b>行銷策略報告</b>來做。片介、預告和影展紀錄我從《${f.name}》帶進來了，還缺三個數字，填完我就開始。`,
    social:`好，用<b>社群後台</b>來做。我有《${f.name}》的預告，先確認這波要推什麼、發在哪裡，再決定剪幾則。`,
    presskit:`好，用<b>官網與 Press Kit</b>來做。《${f.name}》的片介和劇照我先帶進來了，先確認這頁是給誰看的。`,
    listening:`好，用<b>輿情分析</b>來做。先確認關鍵字和市場，我就去抓。`,

  }[tool];

function bindChat(s){
  const t = TOOLS[s.tool];
  view.querySelectorAll('.opt input').forEach(i => i.addEventListener('change', () => i.closest('.opt').classList.toggle('on', i.checked)));
  view.querySelectorAll('.opt-big').forEach(b => b.addEventListener('click', () => { b.parentElement.querySelectorAll('.opt-big').forEach(x => x.classList.remove('on')); b.classList.add('on'); }));
  const start = view.querySelector('[data-start]');
  if(start) start.addEventListener('click', () => runTool(s));
  view.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', () => {
    s.msgs.push({ role:'user', text: b.dataset.label.replace(/ · .*$/,'') });
    s.tool = b.dataset.next; s.status = 'intake'; s.title = `${FILMS.find(x=>x.id===s.film).name} ${TOOLS[s.tool].name}`;
    s.msgs.push({ role:'assistant', kind:'intake', tool: s.tool, done:false });
    saveSessions(); renderChat(s.id);
  }));
  const form = document.getElementById('chatForm');
  form.addEventListener('submit', e => {
    e.preventDefault(); const inp = document.getElementById('reply'); const text = inp.value.trim(); if(!text) return;
    s.msgs.push({ role:'user', text });
    const reply = s.status === 'done' ? `收到，我把這點改進去了，右邊已經更新。修改不扣點。` : `記下了，開始的時候會照這個做。你可以繼續補充，或按上面的「開始」。`;
    s.msgs.push({ role:'assistant', kind:'text', text: reply });
    saveSessions(); renderChat(s.id);
  });
  view.querySelectorAll('.panel-tabs button').forEach(b => b.addEventListener('click', () => { b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); }));
}

function runTool(s){
  const intake = s.msgs.find(m => m.kind === 'intake' && !m.done); if(intake) intake.done = true;
  const prog = { role:'assistant', kind:'progress', tool: s.tool, at:0 };
  s.msgs.push(prog); s.status = 'running'; saveSessions(); renderChat(s.id);
  const steps = STEPS[s.tool].length; const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0;
  const tick = () => {
    i++; prog.at = i;
    if(i < steps){ const el = view.querySelector('.progress'); if(el) el.outerHTML = progressCard(prog); setTimeout(tick, reduce ? 0 : 550); }
    else { s.msgs = s.msgs.filter(m => m !== prog); s.msgs.push({ role:'assistant', kind:'result', tool: s.tool }); s.status = 'done'; s.spent += TOOLS[s.tool].est.pts; credits -= TOOLS[s.tool].est.pts; saveCredits(); saveSessions(); renderChat(s.id); }
  };
  setTimeout(tick, reduce ? 0 : 550);
}

/* ---------- sidebar chats ---------- */
function renderChatList(){
  const el = document.getElementById('chatList'); const cur = (location.hash.split('/')[2]||'');
  if(!sessions.length){ el.innerHTML = `<div class="chat-empty">還沒有對話。<br>從首頁選一個情境，或直接用說的。</div>`; return; }
  const day = ts => { const d = Date.now()-ts; return d < 864e5 ? '今天' : d < 7*864e5 ? '本週' : '更早'; };
  let last = ''; let html = '';
  sessions.forEach(s => { const g = day(s.created); if(g !== last){ html += `<div class="chat-empty" style="padding:8px 12px 2px">${g}</div>`; last = g; }
    html += `<button class="chat-item ${s.id===cur?'active':''}" data-go="#/chat/${s.id}"><span class="t">${esc(s.title)}</span><span class="s">${TOOLS[s.tool].name} · ${s.status==='done'?'完成':'進行中'}</span></button>`; });
  el.innerHTML = html;
}
